<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>포춘텔러 운세 웹페이지</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "맑은 고딕", Arial, sans-serif;
      background: radial-gradient(circle at top, #5f2c82, #1b1033 65%, #090514);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      padding: 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.11);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 35px rgba(197, 128, 255, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      color: #f2d6ff;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #d8c4ff;
      font-size: 15px;
      line-height: 1.5;
    }

    .input-area {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #f4e9ff;
      font-weight: bold;
    }

    .name-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      color: #28113f;
      background: rgba(255, 255, 255, 0.93);
      outline: none;
    }

    input:focus {
      box-shadow: 0 0 12px rgba(225, 180, 255, 0.9);
    }

    .reset-button {
      width: 110px;
      flex-shrink: 0;
      padding: 13px 10px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #2d1b4e, #5a3d8a);
      transition: 0.2s;
    }

    .birth-input {
      margin-bottom: 16px;
    }

    .button-area {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .fortune-button {
      padding: 13px 10px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #7b2cbf, #c77dff);
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(220, 170, 255, 0.85);
    }

    .result-box {
      margin-top: 26px;
      min-height: 120px;
      padding: 22px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.23);
      color: #fff7ff;
      font-size: 18px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      white-space: pre-line;
    }

    @media (max-width: 520px) {
      .container {
        padding: 24px;
      }

      h1 {
        font-size: 27px;
      }

      .name-row {
        flex-direction: column;
      }

      .reset-button {
        width: 100%;
      }

      .button-area {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔮 포춘텔러</h1>

    <p class="subtitle">
      이름과 생년월일을 입력하면 오늘의 운세, 재물운, 타고난 성향을 알려드립니다.
    </p>

    <div class="input-area">
      <label for="userName">이름</label>
      <div class="name-row">
        <input type="text" id="userName" placeholder="이름을 입력하세요">
        <button class="reset-button" onclick="resetForm()">다시하기</button>
      </div>

      <label for="birthDate">생년월일</label>
      <input type="date" id="birthDate" class="birth-input">
    </div>

    <div class="button-area">
      <button class="fortune-button" onclick="showTodayFortune()">오늘의 운세</button>
      <button class="fortune-button" onclick="showMoneyFortune()">재물운</button>
      <button class="fortune-button" onclick="showPersonality()">성향 파악</button>
    </div>

    <div class="result-box" id="resultBox">
      결과가 이곳에 나타납니다.
    </div>
  </div>

  <script>
    const userNameInput = document.getElementById("userName");
    const birthDateInput = document.getElementById("birthDate");
    const resultBox = document.getElementById("resultBox");

    const todayFortunes = [
      "🌟 오늘은 작은 용기가 좋은 결과로 이어질 수 있어요.",
      "🔮 차분하게 하루를 보내면 뜻밖의 기회를 발견할 수 있어요.",
      "✨ 주변 사람과의 대화에서 좋은 힌트를 얻을 수 있어요.",
      "🌙 무리하지 않고 자신의 속도를 지키는 것이 중요해요.",
      "🍀 예상하지 못한 작은 행운이 찾아올 수 있어요.",
      "💫 미뤄 두었던 일을 시작하기에 좋은 날이에요.",
      "🌌 오늘은 집중력이 높아져 계획을 세우기에 알맞아요.",
      "🪄 긍정적인 말과 태도가 하루의 분위기를 바꿀 수 있어요.",
      "🌠 새로운 생각이 떠오를 수 있으니 메모해 두면 좋아요.",
      "🦉 조용히 상황을 살피면 더 좋은 선택을 할 수 있어요.",
      "🌈 가벼운 변화가 기분 좋은 흐름을 만들어 줄 수 있어요.",
      "⭐ 자신감을 가지고 행동하면 좋은 반응을 얻을 수 있어요."
    ];

    const moneyFortunes = [
      "💰 계획적인 소비가 재물운을 안정적으로 만들어 줄 수 있어요.",
      "🪙 작은 절약이 나중에 큰 도움이 될 수 있어요.",
      "💎 돈과 관련된 결정은 한 번 더 확인하는 것이 좋아요.",
      "🍀 예상하지 못한 혜택이나 작은 이득을 얻을 수 있어요.",
      "📌 충동구매를 조심하면 만족스러운 하루가 될 수 있어요.",
      "🧾 지출 내역을 정리하면 재물 흐름이 더 분명해져요.",
      "💼 필요한 곳에 쓰는 돈은 좋은 결과로 이어질 수 있어요.",
      "🔑 아끼는 마음이 오늘의 재물운을 높여 줄 수 있어요.",
      "📦 가지고 있는 것을 잘 활용하면 불필요한 지출을 줄일 수 있어요.",
      "🌟 주변의 조언이 금전 관리에 도움이 될 수 있어요.",
      "🪄 작은 수입이나 보상을 기대해 볼 수 있는 날이에요.",
      "💫 큰 결정보다는 안정적인 관리가 더 중요한 날이에요."
    ];

    const personalityData = {
      1: "❄️ 1월에 태어난 당신은 책임감이 강하고 차분하게 목표를 향해 나아가는 성향이 있어요.",
      2: "🌙 2월에 태어난 당신은 감수성이 풍부하고 다른 사람의 마음을 잘 이해하는 편이에요.",
      3: "🌱 3월에 태어난 당신은 호기심이 많고 새로운 경험을 즐기는 성향이 있어요.",
      4: "🌷 4월에 태어난 당신은 성실하고 꾸준히 노력하는 힘이 돋보여요.",
      5: "☀️ 5월에 태어난 당신은 밝고 활발하며 사람들과 어울리는 것을 좋아해요.",
      6: "🌼 6월에 태어난 당신은 다정하고 주변을 세심하게 챙기는 성향이 있어요.",
      7: "🌊 7월에 태어난 당신은 생각이 깊고 자신만의 기준이 뚜렷한 편이에요.",
      8: "🔥 8월에 태어난 당신은 자신감이 있고 원하는 일을 추진하는 힘이 있어요.",
      9: "🍂 9월에 태어난 당신은 꼼꼼하고 섬세하게 상황을 살피는 성향이 있어요.",
      10: "🎃 10월에 태어난 당신은 균형감이 좋고 사람들과 조화를 이루는 능력이 있어요.",
      11: "🌌 11월에 태어난 당신은 집중력이 강하고 깊이 있는 매력을 가지고 있어요.",
      12: "🎄 12월에 태어난 당신은 긍정적이고 따뜻한 에너지로 주변을 밝게 만들어요."
    };

    function getTodayText() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const date = String(today.getDate()).padStart(2, "0");

      return year + "-" + month + "-" + date;
    }

    birthDateInput.max = getTodayText();

    function validateInput() {
      const name = userNameInput.value.trim();
      const birthDate = birthDateInput.value;
      const todayText = getTodayText();

      if (name === "" || birthDate === "") {
        alert("정보를 입력해 주세요");
        return false;
      }

      if (birthDate > todayText) {
        alert("생년월일은 오늘 날짜까지만 선택할 수 있습니다.");
        birthDateInput.value = "";
        return false;
      }

      return true;
    }

    function createNumberFromText(text) {
      let number = 0;

      for (let i = 0; i < text.length; i++) {
        number += text.charCodeAt(i) * (i + 1);
      }

      return number;
    }

    function getFixedResult(list, type) {
      const name = userNameInput.value.trim();
      const birthDate = birthDateInput.value;
      const today = getTodayText();

      const baseText = name + birthDate + today + type;
      const number = createNumberFromText(baseText);
      const index = number % list.length;

      return list[index];
    }

    function showTodayFortune() {
      if (!validateInput()) {
        return;
      }

      const name = userNameInput.value.trim();
      const fortune = getFixedResult(todayFortunes, "today");

      resultBox.textContent = name + "님의 오늘의 운세\n" + fortune;
    }

    function showMoneyFortune() {
      if (!validateInput()) {
        return;
      }

      const name = userNameInput.value.trim();
      const fortune = getFixedResult(moneyFortunes, "money");

      resultBox.textContent = name + "님의 재물운\n" + fortune;
    }

    function showPersonality() {
      if (!validateInput()) {
        return;
      }

      const name = userNameInput.value.trim();
      const birthDate = birthDateInput.value;
      const month = Number(birthDate.split("-")[1]);
      const personality = personalityData[month];

      resultBox.textContent = name + "님의 성향 파악\n" + personality;
    }

    function resetForm() {
      userNameInput.value = "";
      birthDateInput.value = "";
      resultBox.textContent = "결과가 이곳에 나타납니다.";
    }
  </script>
</body>
</html>
